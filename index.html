<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0a">
<title>Scent Gallery · Catálogo</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,wght@0,500;1,500&family=DM+Sans:wght@400;500;700&display=swap">
<link rel="stylesheet" href="styles.css">
</head><body>
<header>
<div class="spot"></div>
<div id="logo"><img src="logo.png" alt="Scent Gallery"></div>
<h1>Scent Gallery</h1>
<p>Perfumería · Cuidado personal · Relojes</p>
</header>
<div class="bar"><div class="sc" id="types"></div><div class="sc" id="auds"></div>
<div class="sr"><input id="q" type="search" placeholder="Buscar perfume o marca"><select id="so"><option value="0">Catálogo</option><option value="1">Precio ↑</option><option value="2">Precio ↓</option></select></div></div>
<main><div id="count"></div><div class="grid" id="g"></div></main>
<footer>
<div class="fb">Scent Gallery</div>
<p>C. Arturo Bisono Toribio n.º 67, Navarrete, Santiago<br>Tel. 829-752-4096</p>
<a class="wa" href="https://wa.me/18297524096" target="_blank" rel="noopener">Escríbenos por WhatsApp</a>
<small>Precios en pesos dominicanos (RD$). Sujetos a disponibilidad.</small>
</footer>
<button class="fab" id="fab"><span>Ver mi pedido</span><b id="nc">0</b></button>
<div id="ov"></div>
<aside id="dr" aria-label="Mi pedido">
<div class="dh"><span>Mi pedido</span><button class="x" id="cl" aria-label="Cerrar">×</button></div>
<div id="items"></div>
<input id="nm" placeholder="Tu nombre (opcional)">
<textarea id="nt" rows="2" placeholder="Nota o dirección de entrega (opcional)"></textarea>
<div class="tot"><span>Total</span><span id="tt">RD$ 0</span></div>
<button class="send" id="sd">Pedir por WhatsApp</button>
</aside>
<div id="toast"></div>
<script src="script.js"></script>
</body></html>
